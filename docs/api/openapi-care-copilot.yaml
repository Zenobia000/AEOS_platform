openapi: 3.1.0
info:
  title: Care Copilot — 最薄切片 API（AEOS core + pack #1）
  version: 0.1.0
  description: >
    草稿 + 合規 + 活檔案 切片。所有路徑經 AEOS Tenant scope(RLS) + Policy + Audit。
    對應 ADR-0001(nanobot runtime) / ADR-0003(結構化 contact) / system-spec UC-1~4。
servers:
  - url: /api/v1
security:
  - tenantBearer: []          # 每請求帶 tenant context；RLS 強制隔離(legacy ADR-0007)
paths:
  /contacts:
    post:
      summary: UC-1 建立/補充活檔案(結構化 contact)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ContactUpsert' } } }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Contact' } } } }
        '403': { description: 跨租戶拒絕(deny by default), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /contacts/{id}/ingest:
    post:
      summary: UC-1 貼上 markdown/截圖文字 → 抽取補欄位 + 知識索引
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { text: { type: string } }, required: [text] } } }
      responses: { '200': { description: 已索引 + 抽取欄位 } }
  /drafts:
    post:
      summary: UC-2 生成草稿(grounded + 過合規 + 多語氣)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact_id, inbound_message]
              properties:
                contact_id: { type: string }
                inbound_message: { type: string }
                tone: { type: string, enum: [care, casual, business], default: care }
      responses:
        '200': { description: 草稿, content: { application/json: { schema: { $ref: '#/components/schemas/Draft' } } } }
        '422': { description: 知識缺依據 → needs_human=true(不幻覺), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: LLM 失敗(fallback 仍失敗 → needs_human), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /drafts/{id}/decision:
    post:
      summary: UC-3 expert 審核 approve/edit/reject(draft mode，AI 不自動發)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, decided_by]
              properties:
                decision: { type: string, enum: [approve, edit, reject] }
                edited_text: { type: string }
                reason: { type: string }       # reject/關閉合規警示時記錄(回收訓練)
                decided_by: { type: string }
      responses:
        '200': { description: 已記錄 + 全稽核(used_chunks/model/decision/decided_by), content: { application/json: { schema: { $ref: '#/components/schemas/Draft' } } } }
        '403': { description: 跨租戶拒絕, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: edit 後重跑合規為 red → 阻擋, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { description: audit 寫入失敗 → 整筆回滾, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /eval:
    post:
      summary: UC-5 離線對測試集打 B1(draft→judge→採用率)
      requestBody:
        content: { application/json: { schema: { type: object, properties: { knowledge_ref: {type: string}, testset_ref: {type: string} } } } }
      responses: { '200': { description: 採用率 + GO/PIVOT/KILL 裁決 } }
components:
  securitySchemes:
    tenantBearer: { type: http, scheme: bearer }
  schemas:
    ContactUpsert:
      type: object
      required: [display_name]
      properties:                 # 活檔案 7 欄位(ADR-0003)；可空、慢慢補
        display_name: { type: string }
        health_focus: { type: string }
        family: { type: string }
        work: { type: string }
        interests: { type: string }
        comm_pref: { type: string }
        tags: { type: array, items: { type: string } }
    Contact:
      allOf:
        - $ref: '#/components/schemas/ContactUpsert'
        - type: object
          properties:
            id: { type: string }
            tenant_id: { type: string }
            timeline: { type: array, items: { $ref: '#/components/schemas/Interaction' } }
    Interaction:
      type: object                # append-only 互動時間軸
      properties:
        at: { type: string, format: date-time }
        kind: { type: string }
        summary: { type: string }
    Draft:                          # 對應 message 一表多用(ERD)：草稿 + 審核決定 + 送達狀態
      type: object
      properties:
        id: { type: string }
        text: { type: string }
        needs_human: { type: boolean }
        compliance: { type: string, enum: [green, yellow, red] }
        compliance_note: { type: string }     # red 時的改寫建議
        used_chunks: { type: array, items: { type: string } }
        model: { type: string }
        decision: { type: string, enum: [approve, edit, reject, needs_human, manual_override] }
        decided_by: { type: string }          # NULL = 未審
        sent_at: { type: string, format: date-time, nullable: true }  # 與 decision 正交；W1 恆 null，W2 回發後填(鐵律掃描 TC-SEC-03)
    # --- Review 修正 R2 (2026-05-28, B-5) ---
    Error:                          # 統一 error model，全 4xx/5xx 引用
      type: object
      required: [code, message]
      properties:
        code: { type: string }      # e.g. cross_tenant_denied / knowledge_insufficient / llm_unavailable
        message: { type: string }
        details: { type: object }
    IngestResult:
      type: object
      properties: { indexed_chunks: { type: integer }, extracted_fields: { type: array, items: { type: string } } }
    EvalResult:
      type: object
      properties: { approve_rate: { type: number }, adopt_rate: { type: number }, verdict: { type: string, enum: [go, pivot, kill] } }
# --- 已落地（本輪圓桌收斂）---
# - 主要 4xx/5xx 已 $ref Error（contacts 403 / drafts 422·503 / decision 403·422·500）
# - Draft 含 decision/decided_by/sent_at，與 message schema(migration) 對齊
# - C4 authority：合規判定 = Policy Engine；needs_human = 知識/grounding 層；API 僅傳輸
# --- 明確 defer 至 W2 design（非 limbo TODO，owner = SD）---
# - Idempotency-Key header + 24h 去重窗（W1 無寫入 API，eval-only）
# - /ingest /eval response 綁 IngestResult/EvalResult schema
# - telemetry x-telemetry span = draft.generate / policy.scan / audit.write
