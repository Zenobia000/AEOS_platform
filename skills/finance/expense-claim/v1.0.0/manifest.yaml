# Skill Version Manifest — finance/expense-claim v1.0.0
#
# 依 db-schema.md §3.2 + MC-005：
# 本檔即 skill_version row 的 source of truth；DB row 由 Skill Loader
# 從 git 讀本檔後 upsert。git_commit_sha 由 loader 在 INSERT 時填。
#
# 由 scripts/new_skill.py 自動產生 — 依 AUTHORING-GUIDE.md 心法填寫。

id: "finance/expense-claim"
version: "1.0.0"
status: draft  # draft → testing → approved → production → deprecated

# 對應 DB skill 表
skill:
  slug: "finance/expense-claim"
  vertical: "finance"
  name: "報帳審查助手"
  description: |
    協助員工填寫差旅報帳單、查詢公司報帳政策與額度。
  owner: cto@aeos.dev

# system prompt 模板路徑（相對於本 manifest）
prompt_template_ref: system.md

# 該版本可呼叫的 tool slugs（DB skill_version.tool_bindings）
tool_bindings:
  - search_knowledge      # 通用 KB 檢索
  # - {{VERTICAL_TOOL}}   # vertical 專屬 tool（# STUB: replace before production）

# 該版本套用的 policy（DB skill_version.policy_refs）
policy_refs:
  - policy-no-restricted-tool-in-canary
  - policy-block-pii-leak

# input/output JSON Schema
io_contract:
  input:
    type: object
    properties:
      user_message:
        type: string
      conversation_id:
        type: string
        format: uuid
    required: [user_message, conversation_id]
  output:
    type: object
    properties:
      response_text:
        type: string
      confidence:
        type: number
        minimum: 0.0
        maximum: 1.0
      requires_handoff:
        type: boolean
    required: [response_text, confidence, requires_handoff]

# 測試集
test_set_ref: test_set.yaml

# Quality Gate 目標
quality_gate_targets:
  pass_rate: 0.80
  latency_p95_ms: 5000
  human_override_rate: 0.20
