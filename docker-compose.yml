# 本機開發環境 - PostgreSQL 15 + pgvector + Redis 7
# 對應 SAD-v0.1 §3 (per-tenant VM Docker Compose) 的本地簡化版
# 啟動：docker compose up -d
# 停止：docker compose down
# 清資料：docker compose down -v

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: aeos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aeos
      POSTGRES_PASSWORD: aeos_dev_only
      POSTGRES_DB: aeos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeos -d aeos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aeos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
