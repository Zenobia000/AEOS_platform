# /etc/nginx/sites-available/aeos.conf
# 在 Hetzner CX22 上，nginx 接 443 + Let's Encrypt（certbot），反代到：
#   obs.example.com → Grafana (127.0.0.1:3000)
#   api.example.com → AEOS API (127.0.0.1:8000)
#   expert.example.com → Expert UI (靜態 dist/)
#
# 一次性設定：
#   sudo apt install -y nginx certbot python3-certbot-nginx
#   sudo cp aeos.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/aeos.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d obs.example.com -d api.example.com -d expert.example.com
#   sudo systemctl reload nginx
#
# 之後 certbot 自動續期（cron）。

# ── Grafana ────────────────────────────────────────
server {
    listen 80;
    server_name obs.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name obs.example.com;

    # certbot 會自動填入 ssl_certificate / ssl_certificate_key
    # ssl_certificate /etc/letsencrypt/live/obs.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/obs.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafana live (WebSocket)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ── AEOS API ──────────────────────────────────────
server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    client_max_body_size 20m;  # KB ingest 上傳檔案

    location /api/v1/webhooks/line/ {
        # LINE webhook：保留原 raw body 供 HMAC 驗簽
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Expert UI（靜態） ─────────────────────────────
server {
    listen 80;
    server_name expert.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name expert.example.com;

    root /var/www/aeos-expert;  # 把 web/expert/dist/ 部署到此處
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # /api 反代到後端
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
