server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 抓所有 docker container 的 stdout/stderr
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: /(.*)
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
    pipeline_stages:
      # AEOS app 輸出結構化 JSON（OBS-001 §4.1），可直接解
      - json:
          expressions:
            level: level
            event: event
            tenant_id: tenant_id
            trace_id: trace_id
      - labels:
          level:
          event:
